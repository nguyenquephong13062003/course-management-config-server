spring:
  application:
    name: identity-service
  datasource:
    url: jdbc:postgresql://localhost:5432/identity_db
    username: postgres
    password: 12345678
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
      naming:
        implicit-strategy: org.hibernate.boot.model.naming.ImplicitNamingStrategyLegacyJpaImpl
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    properties:
      hibernate:
        format_sql: true
        show_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

jwt:
  secret-key: W6uEhUvaX7MtLaUrVsJHTIQNAcaOvRa3zNpGcxIdjGAGIAJU9TotBMdrUFjNCGAE
  expired: 900000 # 15 minutes in milliseconds

server:
  port: 8081

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka/

  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}

# Identity headers are trusted only when injected by the API Gateway.
# The Gateway must strip client-supplied X-Auth-UserId/X-Auth-Roles headers,
# and this service must not be directly reachable by untrusted clients.
identity:
  security:
    gateway-headers-enabled: true

  # Synchronous call to course-service, resolved through Eureka (load balanced).
  course-service:
    base-url: http://course-service
