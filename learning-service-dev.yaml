spring:
  application:
    name: learning-service
  datasource:
    url: jdbc:postgresql://localhost:5432/learning_db_v2
    username: postgres
    password: 12345678
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
      naming:
        implicit-strategy: org.hibernate.boot.model.naming.ImplicitNamingStrategyLegacyJpaImpl
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
      properties:
        max:
          block:
            ms: 3000
        spring:
          json:
            add:
              type:
                headers: false

server:
  port: 8083

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}

learning:
  # Synchronous call to course-service, resolved through Eureka (load balanced).
  course-service:
    base-url: http://course-service
  kafka:
    enrollment-topic: enrollment-events
  security:
    # Identity headers (X-Auth-UserId / X-Auth-Roles) are trusted only when injected by the
    # API Gateway. This service must not be directly reachable by untrusted clients.
    gateway-headers-enabled: true
