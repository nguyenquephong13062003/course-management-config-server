spring:
  application:
    name: course-service
  datasource:
    url: jdbc:postgresql://localhost:5432/course_db_v2
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:12345678}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
      naming:
        implicit-strategy: org.hibernate.boot.model.naming.ImplicitNamingStrategyLegacyJpaImpl
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  data:
    redis:
      host: localhost
      port: 6379
      password: rikkeiacademy
  cache:
    type: redis
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
      properties:
        max:
          block:
            ms: 3000
        spring:
          json:
            add:
              type:
                headers: false

server:
  port: 8082

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}

course:
  cache:
    ttl-minutes: 10
  kafka:
    course-topic: course-events
  identity-service:
    base-url: http://identity-service
  security:
    # Identity headers (X-Auth-UserId / X-Auth-Roles) are trusted only when injected by the
    # API Gateway. This service must not be directly reachable by untrusted clients.
    gateway-headers-enabled: true
